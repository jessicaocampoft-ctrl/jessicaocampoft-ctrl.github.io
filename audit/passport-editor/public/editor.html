<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor del Pasaporte de Movimiento</title><style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#f5fbfa;color:#17212b}main{background:#fff;border:1px solid #bce9e3;border-radius:18px;padding:26px;box-shadow:0 8px 28px #0b706018}h1{color:#079d91}label{display:block;margin:12px 0 5px;font-weight:650}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #9fded6}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#11b5a4;color:#052a29;font-weight:700;margin:5px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stamp{padding:11px;text-align:center;background:#eef9f8;border-radius:9px}.stamp.on{background:#14b8a6;color:#fff}.counter{display:flex;align-items:center;gap:8px;margin:8px 0}.counter button{min-width:36px}.notice{padding:10px;margin:12px 0;border-radius:9px;background:#eef9f8}.error{background:#fff1f0;color:#9b241d}.link{word-break:break-all}</style></head><body><main>
<h1>Editor del Pasaporte de Movimiento</h1><p>Busca un único paciente por nombre y teléfono.</p>
<form id="search"><label>Nombre<input id="nombre" required maxlength="120"></label><label>Teléfono<input id="telefono" required inputmode="numeric" maxlength="20"></label><button>Buscar o crear Pasaporte</button></form><div id="message" class="notice hidden"></div>
<section id="editor" class="hidden"><h2 id="patient"></h2><p id="state"></p><p class="link" id="link"></p><button id="open" type="button">Ver como paciente</button><h3>Sesiones completadas: <span id="total">0</span>/16</h3><div class="counter"><button data-change="-1" data-type="stamps">−</button><button data-change="1" data-type="stamps">+</button></div><div class="grid" id="stamps"></div><h3>Reto mensual: <span id="retoTotal">0</span>/2</h3><div class="counter"><button data-change="-1" data-type="reto">−</button><button data-change="1" data-type="reto">+</button></div><div class="grid" id="reto"></div><button id="save" type="button">Guardar progreso</button><button id="regen" type="button">Regenerar token</button></section>
</main><script>
let current=null,stamps={},reto={};const q=(s)=>document.querySelector(s);function msg(text,error=false){const el=q('#message');el.textContent=text;el.className='notice'+(error?' error':'');}function read(v,n){const src=(v&&((v.stamps||v.sellos)||v))||{};const o={};for(let i=1;i<=n;i++)o[i]=!!(src[i]??src[String(i)]);return o}function count(v){return Object.values(v).filter(Boolean).length}function render(){q('#total').textContent=count(stamps);q('#retoTotal').textContent=count(reto);for(const [id,values] of [['stamps',stamps],['reto',reto]])q('#'+id).innerHTML=Object.keys(values).map(k=>`<button class="stamp ${values[k]?'on':''}" data-stamp="${id}:${k}">${k}</button>`).join('')}async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:undefined,body:data?JSON.stringify(data):undefined,credentials:'include',cache:'no-store'});const p=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!p.ok)throw Error(p.error||'Error del editor.');return p}q('#search').onsubmit=async(e)=>{e.preventDefault();msg('Buscando…');try{const p=await api('/api/passport',{nombre:q('#nombre').value,telefono:q('#telefono').value});current=p.passport;stamps=read(current.passport,16);reto=read(current.descarga,2);q('#patient').textContent=current.nombre;q('#state').textContent='Estado: '+current.estado;q('#link').textContent=current.link;q('#open').onclick=()=>window.open(current.link,'_blank','noopener');q('#editor').classList.remove('hidden');render();msg('Pasaporte cargado.');}catch(e){msg(e.message,true)}};document.addEventListener('click',(e)=>{const b=e.target;if(b.dataset.stamp){const [kind,index]=b.dataset.stamp.split(':');(kind==='stamps'?stamps:reto)[index]=!(kind==='stamps'?stamps:reto)[index];render()}if(b.dataset.change){const values=b.dataset.type==='stamps'?stamps:reto;const keys=Object.keys(values);if(b.dataset.change==='1'){const key=keys.find(k=>!values[k]);if(key)values[key]=true}else{const key=[...keys].reverse().find(k=>values[k]);if(key)values[key]=false}render()}});q('#save').onclick=async()=>{try{msg('Guardando…');const p=await api('/api/save',{id:current.id,stamps,reto});current=p.passport;stamps=read(current.passport,16);reto=read(current.descarga,2);render();msg('Progreso guardado y confirmado.');}catch(e){msg(e.message,true)}};q('#regen').onclick=async()=>{if(!confirm('¿Regenerar el token? El enlace anterior dejará de funcionar.'))return;try{msg('Regenerando…');const p=await api('/api/regenerate',{id:current.id});current=p.passport;q('#link').textContent=current.link;q('#open').onclick=()=>window.open(current.link,'_blank','noopener');msg('Token regenerado.');}catch(e){msg(e.message,true)}};
</script></body></html>
