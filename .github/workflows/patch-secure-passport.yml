name: Apply secure passport backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-secure-passport.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply secure passport patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_passport.py
          python /tmp/patch_passport.py
          rm -f .github/workflows/patch-secure-passport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pasaporte): completar backend seguro y sellos automáticos"
          git push
