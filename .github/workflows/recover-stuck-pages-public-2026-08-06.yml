name: Liberar despliegue público bloqueado

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-stuck-pages-public-2026-08-06.yml

permissions:
  contents: read
  pages: write

jobs:
  cancelar-despliegue-atascado:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar despliegue anterior atascado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            --output /tmp/pages-cancel-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/9e0362ab623073b3a20d9dc43d7811a967fd9d8d/cancel")
          cat /tmp/pages-cancel-response.txt || true
          echo "Código HTTP: ${code}"
          case "${code}" in
            200|202|204|404|409) exit 0 ;;
            *) exit 1 ;;
          esac
