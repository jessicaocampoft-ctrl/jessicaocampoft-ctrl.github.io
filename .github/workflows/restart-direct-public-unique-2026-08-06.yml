name: Reiniciar publicación pública con identificador único

on:
  push:
    branches:
      - pages-public-extended-2026-08-06
    paths:
      - .github/workflows/restart-direct-public-unique-2026-08-06.yml

permissions:
  actions: write
  pages: write
  contents: read

jobs:
  reiniciar:
    runs-on: ubuntu-latest
    steps:
      - name: Cerrar el intento anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/6f890c18e6c1123d4f5206877eb57fdf2c23fb17/cancel" \
            --output /tmp/cancel-pages.txt || true
          cat /tmp/cancel-pages.txt || true

          curl --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31110838706/cancel" \
            --output /tmp/cancel-run.txt || true
          cat /tmp/cancel-run.txt || true

          sleep 10

      - name: Iniciar el despliegue nuevo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            --output /tmp/dispatch-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-pages-public.yml/dispatches" \
            --data '{"ref":"main"}')
          cat /tmp/dispatch-response.txt || true
          echo "Dispatch: HTTP ${code}"
          test "${code}" = "204"
