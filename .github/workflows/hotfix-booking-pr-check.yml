name: Hotfix booking PR check

on:
  pull_request:
    branches: [main]
    paths:
      - public-schedule-client.js
      - .github/workflows/hotfix-booking-pr-check.yml

permissions:
  contents: read

jobs:
  booking-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis
        run: node --check public-schedule-client.js
      - name: Validar contratos del hotfix
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "data.ok !== true" public-schedule-client.js
          grep -Fq "if (!data.id)" public-schedule-client.js
          grep -Fq "bookingAmbiguous = true" public-schedule-client.js
          grep -Fq "SLOT_TAKEN" public-schedule-client.js
          grep -Fq "verifyCurrentSlot" public-schedule-client.js
          grep -Fq "AbortController" public-schedule-client.js
          grep -Fq "No pudimos confirmar automáticamente si la reserva quedó guardada" public-schedule-client.js
          if grep -Fq "mode: 'no-cors'" public-schedule-client.js; then
            echo 'El hotfix no debe usar no-cors para confirmar reservas.' >&2
            exit 1
          fi
          echo '✅ Contratos del hotfix presentes.'
