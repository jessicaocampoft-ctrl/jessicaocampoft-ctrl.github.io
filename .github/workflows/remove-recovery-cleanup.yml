name: Retirar sede Recovery por completo

on:
  push:
    branches:
      - remove-recovery-booking-20260819
    paths:
      - .github/workflows/remove-recovery-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          ref: remove-recovery-booking-20260819
          fetch-depth: 0

      - name: Limpiar web y backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8-sig')

          # Retirar únicamente las experiencias que dependían de la sede cerrada.
          card_re = re.compile(r'\s*<article class="experience-card[^\"]*">.*?</article>', re.S)
          removed = 0
          def keep_or_remove(match):
              global removed
              block = match.group(0)
              if 'Campestre Recovery' in block or 'Sede Campestre Recovery' in block:
                  removed += 1
                  return ''
              return block
          index = card_re.sub(keep_or_remove, index)

          # Dejar la agenda con Santa Mónica + domicilio.
          index = re.sub(r'\s*<button class="bk-mod-btn" id="modRecovery"[^>]*>.*?</button>', '', index, flags=re.S)
          index = re.sub(r'\sdata-price-recovery="[^"]*"', '', index)
          index = index.replace('data-venues="santa,recovery,domicilio"', 'data-venues="santa,domicilio"')
          index = index.replace('Santa Mónica / Recovery $75.000', 'Santa Mónica $75.000')
          index = index.replace('Santa Mónica / Recovery $110.000', 'Santa Mónica $110.000')
          index = index.replace("service: '', priceP: '', priceD: '', priceSanta: '', priceRecovery: '',", "service: '', priceP: '', priceD: '', priceSanta: '',")
          index = re.sub(r'^\s*bk\.priceRecovery\s*=\s*el\.dataset\.priceRecovery\s*\|\|\s*\'\';\s*$', '', index, flags=re.M)
          index = index.replace("bk.modality      = bk.venues.indexOf('santa') >= 0 ? 'Sede Santa Mónica' : (bk.venues.indexOf('recovery') >= 0 ? 'Sede Campestre Recovery' : 'Domicilio');", "bk.modality      = bk.venues.indexOf('santa') >= 0 ? 'Sede Santa Mónica' : 'Domicilio';")
          index = re.sub(r"^\s*if \(m === 'Sede Campestre Recovery'\) return 'recovery';\s*$", '', index, flags=re.M)
          index = re.sub(r"^\s*else if \(venueAllowed\('recovery'\)\) bk\.modality = 'Sede Campestre Recovery';\s*$", '', index, flags=re.M)
          index = re.sub(r"^\s*\{id:'modRecovery', key:'recovery', label:'Sede Campestre Recovery'\},\s*$", '', index, flags=re.M)
          index = re.sub(r"^\s*document\.getElementById\('modRecovery'\)\.classList\.toggle\('active', m === 'Sede Campestre Recovery'\);\s*$", '', index, flags=re.M)
          index = re.sub(r"^\s*if \(bk\.modality === 'Sede Campestre Recovery'\) return bk\.priceRecovery \|\| bk\.priceSanta \|\| bk\.priceP;\s*$", '', index, flags=re.M)
          index = re.sub(r"^\s*priceRecovery:\s*bk\.priceRecovery,\s*$", '', index, flags=re.M)
          index = index.replace('bk.service = bk.priceP = bk.priceD = bk.priceSanta = bk.priceRecovery = bk.date = bk.time = bk.name = bk.phone = bk.email = bk.address = bk.notes = \'\';', 'bk.service = bk.priceP = bk.priceD = bk.priceSanta = bk.date = bk.time = bk.name = bk.phone = bk.email = bk.address = bk.notes = \'\';')

          if removed < 1:
              raise SystemExit('No se encontró ninguna experiencia ligada a Recovery para retirar.')
          if re.search(r'(?i)recovery|campestre', index):
              leftovers = sorted(set(re.findall(r'.{0,45}(?:recovery|campestre).{0,80}', index, flags=re.I)))
              raise SystemExit('Quedaron referencias Recovery/Campestre en index.html: ' + ' | '.join(leftovers[:8]))
          index_path.write_text(index, encoding='utf-8')

          # Limpiar el cliente de agenda sin alterar las protecciones de reservas existentes.
          client_path = Path('public-schedule-client.js')
          client = client_path.read_text(encoding='utf-8-sig')
          client = client.replace('La Sede Campestre Recovery ya no está disponible para agendamiento. Selecciona Santa Mónica o domicilio.', 'Esa sede ya no está disponible para agendamiento. Selecciona Santa Mónica o domicilio.')
          client_path.write_text(client, encoding='utf-8')

          # Retirar Recovery de la configuración activa del backend. Los registros históricos en Sheets no se borran.
          backend_path = Path('google-apps-script.js')
          backend = backend_path.read_text(encoding='utf-8-sig')

          backend = re.sub(
              r",\n\s*recovery:\s*\{\s*\n\s*label:\s*'Sede Campestre Recovery',\s*\n\s*enabled:\s*true,\s*\n\s*services:\s*\[.*?\],\s*\n\s*weekly:\s*defaultPublicWeekly_\(\)\s*\n\s*\}",
              '', backend, flags=re.S
          )
          backend = re.sub(
              r"var allowed = \{\s*santa:\s*defaults\.venues\.santa\.services\.slice\(\),\s*recovery:\s*defaults\.venues\.recovery\.services\.slice\(\)\s*\};",
              "var allowed = {\n    santa: defaults.venues.santa.services.slice()\n  };",
              backend, flags=re.S
          )
          backend = backend.replace("['santa','recovery']", "['santa']")
          backend = re.sub(r"^\s*if \(value\.indexOf\('recovery'\) >= 0 \|\| value\.indexOf\('campestre'\) >= 0\) return 'recovery';\s*$", '', backend, flags=re.M)
          backend = backend.replace('// Domicilios conserva la jornada pública histórica; este módulo controla las dos sedes físicas.', '// Domicilios conserva la jornada pública histórica; este módulo controla la sede física.')
          backend = re.sub(
              r"var price = d\.priceSelected \|\| \(d\.modality === 'Domicilio'\s*\? d\.priceD\s*:\s*\(d\.modality === 'Sede Campestre Recovery' \? \(d\.priceRecovery \|\| d\.priceP\) : d\.priceP\)\);",
              "var price = d.priceSelected || (d.modality === 'Domicilio' ? d.priceD : d.priceP);",
              backend, flags=re.S
          )
          backend = re.sub(
              r"location: d\.modality === 'Domicilio'\s*\? \(d\.address \|\| 'Domicilio - direccion por confirmar'\)\s*:\s*\(d\.modality === 'Sede Campestre Recovery'\s*\? 'Sede Campestre Recovery - ubicacion compartida al confirmar'\s*:\s*'Ubicacion compartida al confirmar la reserva'\)",
              "location: d.modality === 'Domicilio'\n      ? (d.address || 'Domicilio - direccion por confirmar')\n      : 'Ubicacion compartida al confirmar la reserva'",
              backend, flags=re.S
          )

          if 'Sede Campestre Recovery' in backend or 'Campestre Recovery' in backend:
              raise SystemExit('Quedaron referencias nominales a la sede Recovery en google-apps-script.js')
          if "['santa','recovery']" in backend or 'defaults.venues.recovery' in backend:
              raise SystemExit('Recovery sigue presente en la configuración pública activa del backend')
          backend_path.write_text(backend, encoding='utf-8')
          PY

      - name: Validar sintaxis y limpieza
        shell: bash
        run: |
          node --check public-schedule-client.js
          if grep -Eqi 'recovery|campestre' index.html; then
            echo 'Aún hay referencias Recovery/Campestre en la web pública.' >&2
            grep -Ein 'recovery|campestre' index.html | head -20 >&2
            exit 1
          fi
          if grep -Fq 'Sede Campestre Recovery' public-schedule-client.js google-apps-script.js; then
            echo 'Aún queda el nombre de la sede retirada en código activo.' >&2
            exit 1
          fi
          if grep -Fq "defaults.venues.recovery" google-apps-script.js; then
            echo 'Recovery aún está en la configuración pública del backend.' >&2
            exit 1
          fi

      - name: Commit de limpieza
        shell: bash
        run: |
          rm -f .github/workflows/remove-recovery-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html public-schedule-client.js google-apps-script.js .github/workflows/remove-recovery-cleanup.yml
          git diff --cached --check
          git commit -m 'chore: retirar por completo la sede Recovery'
          git push origin HEAD:remove-recovery-booking-20260819

      - name: Preparar Node.js para Apps Script
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.3.0

      - name: Restaurar credencial Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configurar y desplegar backend
        shell: bash
        run: |
          printf '%s' '{"scriptId":"1KVmo_TpTAkwLXQjMVvSO51YDtojr64XsnWg8I7bz0UkGht9S1W7WD0zI","rootDir":"."}' > .clasp.json
          printf '%s\n' '**/**' '!appsscript.json' '!google-apps-script.js' > .claspignore
          clasp push --force
          clasp deploy --deploymentId AKfycbwPE46Z_7mnCPTE7KcthlluGXsuqwAofVBHS0jGXv7C8ekLpmPzHu5x0jFYB7yxEquw --description "Retiro sede Recovery - $GITHUB_SHA"
          clasp deploy --deploymentId AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC --description "Retiro sede Recovery - $GITHUB_SHA"

      - name: Verificar configuración pública desplegada
        shell: bash
        run: |
          url='https://script.google.com/macros/s/AKfycbwPE46Z_7mnCPTE7KcthlluGXsuqwAofVBHS0jGXv7C8ekLpmPzHu5x0jFYB7yxEquw/exec?action=publicScheduleConfig'
          response="$(curl --fail --silent --show-error --location "$url")"
          printf '%s' "$response" > /tmp/public-schedule.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/public-schedule.json', encoding='utf-8'))
          venues = ((data or {}).get('config') or {}).get('venues') or {}
          if 'recovery' in venues:
              raise SystemExit('El despliegue todavía expone Recovery')
          if 'santa' not in venues:
              raise SystemExit('El despliegue perdió Santa Mónica')
          print('Configuración pública OK:', ', '.join(sorted(venues)))
          PY
