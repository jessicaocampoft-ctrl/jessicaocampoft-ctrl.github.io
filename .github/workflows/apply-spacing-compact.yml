name: Aplicar compactación de espacios

on:
  push:
    branches:
      - compactacion-espacios-v1-2026-08-07

permissions:
  contents: write

jobs:
  aplicar:
    if: contains(github.event.head_commit.message, '[spacing-compact]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar CSS de compactación
        run: python .github/apply_spacing_compact.py

      - name: Validar alcance
        run: |
          set -euo pipefail
          grep -q 'spacing-compact-v1-2026-08-07' index.html
          grep -q 'loadReviews();' index.html
          grep -q 'APPS_SCRIPT_URL' index.html
          grep -q 'pasaporte.html' index.html

      - name: Guardar resultado limpio
        run: |
          set -euo pipefail
          rm -f .github/apply_spacing_compact.py
          rm -f .github/workflows/apply-spacing-compact.yml
          rm -f .github/spacing-compact-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: compactar espacios visuales"
          git push origin HEAD:compactacion-espacios-v1-2026-08-07
