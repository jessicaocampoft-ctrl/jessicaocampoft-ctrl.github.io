name: Aplicar corrección visual V2 2026-08-07

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: contains(github.event.head_commit.message, '[visual-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar parche V2
        run: python .github/apply_visual_v2.py

      - name: Validar archivos críticos
        run: |
          grep -q 'visual-refresh-v2-2026-08-07' index.html
          grep -q 'loadReviews();' index.html
          grep -q 'APPS_SCRIPT_URL' index.html
          grep -q 'pasaporte.html' index.html

      - name: Limpiar temporales y guardar
        run: |
          rm -f .github/apply_visual_v2.py
          rm -f .github/workflows/apply-visual-v2-2026-08-07.yml
          rm -f .github/visual-v2-trigger-2026-08-07.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: aplicar corrección visual V2"
          git push origin main
