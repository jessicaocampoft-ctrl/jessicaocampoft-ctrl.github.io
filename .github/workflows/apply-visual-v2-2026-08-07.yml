name: Aplicar corrección visual V2 2026-08-07

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: contains(github.event.head_commit.message, '[visual-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar V2 visual aprobada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          def rep(old, new, label, required=True):
              global t
              if old not in t:
                  if required:
                      raise SystemExit(f'No se encontró: {label}')
                  return
              t = t.replace(old, new, 1)

          # Menú más corto y respirado.
          rep('<li><a href="#servicios" class="nav-split"><span>Fisioterapia y</span><span>rehabilitación</span></a></li>',
              '<li><a href="#servicios">Servicios</a></li>', 'menú servicios')
          rep('<li><a href="#experiencias" class="nav-wellness-label">Masajes relajantes y bienestar</a></li>',
              '<li><a href="#experiencias">Masajes y bienestar</a></li>', 'menú bienestar')
          rep('<li><a href="#equipo">Equipo</a></li>', '<li><a href="#equipo">Nosotros</a></li>', 'menú nosotros')
          rep('        <li><a href="#agenda">Agenda</a></li>\n        <li><a href="#contacto">Contacto</a></li>',
              '        <li><a href="#reseñas">Reseñas</a></li>', 'menú reseñas')

          # Hero limpio, una sola tipografía y menos información simultánea.
          rep('<h1>Recupera tu movimiento con <em>atención fisioterapéutica personalizada.</em></h1>',
              '<h1>Recupera tu movimiento con atención fisioterapéutica personalizada.</h1>', 'hero título')
          rep('Realizamos valoración fisioterapéutica, rehabilitación funcional, ejercicio terapéutico y manejo de lesiones, con atención en nuestra sede de Dosquebradas y a domicilio en Pereira y Dosquebradas. Cada proceso se adapta a tus necesidades, objetivos y evolución.',
              'Valoración fisioterapéutica, rehabilitación funcional y ejercicio terapéutico con atención en nuestra sede de Dosquebradas y a domicilio en Pereira y Dosquebradas.', 'hero subtítulo')
          rep('Reservar por WhatsApp', 'WhatsApp', 'CTA WhatsApp hero', required=False)

          # Servicios y bienestar: títulos sin mezcla tipográfica y copy más breve.
          rep('<h2>Un proceso diseñado <em>para ti</em></h2>',
              '<h2>Un proceso pensado para tus necesidades</h2>', 'título servicios')
          rep('Comenzamos con una valoración fisioterapéutica para comprender tus síntomas, movimiento, fuerza y capacidad funcional. A partir de los hallazgos definimos el proceso más adecuado para tus necesidades, objetivos y evolución.',
              'Comenzamos con una valoración fisioterapéutica para comprender tus síntomas, movimiento y capacidad funcional. A partir de los hallazgos definimos el proceso más adecuado para ti.', 'intro servicios')
          rep('<h2><em>Masajes relajantes</em> y experiencias de bienestar</h2>',
              '<h2>Tu momento para bajar el ritmo</h2>', 'título bienestar')
          rep('Desconéctate de la rutina y regálale a tu cuerpo un momento de descanso. Disfruta experiencias con masajes relajantes, calor, aromas y diferentes elementos de bienestar. Estas experiencias no sustituyen una valoración ni un tratamiento fisioterapéutico cuando existe una lesión o limitación funcional.',
              'Experiencias diseñadas para desconectarte de la rutina y disfrutar un momento de relajación y bienestar.', 'intro bienestar')

          # Jessica: resumen corto, más visual.
          t = re.sub(r'<h2>Jessica <em>Ocampo</em></h2>', '<h2>Jessica Ocampo</h2>', t, count=1)
          about_pattern = re.compile(r'<div class="about-body clamped" id="aboutBody">.*?</div>\s*<button class="about-read-more".*?</button>', re.S)
          about_new = '''<div class="about-body" id="aboutBody">
            <p>Mi enfoque combina valoración fisioterapéutica, ejercicio terapéutico, técnicas manuales y educación para desarrollar procesos personalizados según las necesidades y objetivos de cada persona.</p>
          </div>
          <div class="about-facts-v2">
            <div><strong>Experiencia deportiva</strong><span>Deportista de alto rendimiento.</span></div>
            <div><strong>Atención personalizada</strong><span>Procesos adaptados a cada persona.</span></div>
            <div><strong>Enfoque funcional</strong><span>Movimiento, ejercicio y educación.</span></div>
          </div>'''
          t, n = about_pattern.subn(about_new, t, count=1)
          if n != 1:
              raise SystemExit('No se pudo simplificar la sección Jessica')

          # Reseñas: título visible y sin tipografía combinada.
          rep('<h2>Lo que dicen nuestros <em>pacientes</em></h2>',
              '<h2>Lo que dicen quienes han confiado en Cuidándote</h2>', 'título reseñas', required=False)

          # Estilos V2. Se añade al final para anular de forma segura el rediseño anterior.
          css = r'''
<style id="visual-refresh-v2-2026-08-07">
  :root {
    --primary: #72DCCE;
    --primary-hover: #5FCFC1;
    --primary-dark: #45BFB3;
    --text: #283936;
    --text-muted: #65716F;
    --surface-1: #FFFFFF;
    --surface-2: #F1FBF9;
    --border: rgba(69,191,179,.20);
    --font-heading: "Trebuchet MS", Arial, sans-serif;
    --font-body: "Trebuchet MS", Arial, sans-serif;
    --font-mono: "Trebuchet MS", Arial, sans-serif;
  }

  html { background:#fff; }
  body { color:var(--text); background:#fff; font-family:var(--font-body); }
  h1,h2,h3,h4,h5,h6,.hero h1,.section-title,.about-content h2,.services-header h2,.experiences-header h2,
  .review-name,.plan-name,.pasaporte-title { font-family:var(--font-heading)!important; font-style:normal!important; letter-spacing:-.025em; color:var(--text)!important; }
  em,i { font-family:inherit!important; font-style:normal!important; color:inherit!important; }

  /* Navegación limpia y con logo protagonista */
  .nav { padding:16px 0!important; background:rgba(255,255,255,.98)!important; box-shadow:none!important; border-bottom:1px solid var(--border)!important; }
  .nav.scrolled { padding:12px 0!important; }
  .brand-logo { width:226px!important; padding:0!important; }
  .nav.scrolled .brand-logo { width:210px!important; }
  .brand-logo img { width:100%!important; height:auto!important; opacity:1!important; filter:none!important; }
  .brand-logo .logo-byline { display:none!important; }
  .nav-links { gap:clamp(18px,1.7vw,30px)!important; }
  .nav-links a { font-family:var(--font-body)!important; font-size:.72rem!important; letter-spacing:.045em!important; font-weight:700!important; color:#42514E!important; white-space:nowrap; }
  .nav-links a:hover,.nav-links a.active,.nav-pasaporte { color:#24AFA3!important; }
  .nav-cta { background:var(--primary)!important; color:#203431!important; border:0!important; padding:12px 20px!important; border-radius:10px!important; box-shadow:none!important; }
  .nav-cta:hover { background:var(--primary-hover)!important; color:#203431!important; }

  /* Hero: sin verde oscuro y con más aire */
  .hero { padding:154px 0 88px!important; background:linear-gradient(90deg,#FFFFFF 0 51%,#F0FBF9 51% 100%)!important; }
  .hero-grid { gap:70px!important; align-items:center!important; }
  .hero-enabled-badge { color:#248E86!important; background:#F0FBF9!important; border:1px solid rgba(69,191,179,.22)!important; }
  .hero-enabled-check { background:#DDF7F3!important; color:#248E86!important; }
  .hero h1 { font-size:clamp(2.7rem,4.2vw,4.2rem)!important; line-height:1.08!important; max-width:650px!important; font-weight:700!important; }
  .hero-subtitle { max-width:610px!important; font-size:1rem!important; line-height:1.75!important; color:var(--text-muted)!important; margin:24px 0 30px!important; }
  .hero-buttons { gap:14px!important; margin-bottom:18px!important; }
  .btn-solid,.pasaporte-cta { background:var(--primary)!important; color:#203431!important; box-shadow:none!important; border:0!important; }
  .btn-solid:hover,.pasaporte-cta:hover { background:var(--primary-hover)!important; color:#203431!important; }
  .btn-outline { color:#248E86!important; border-color:rgba(69,191,179,.45)!important; background:#fff!important; }
  .hero-trust-note { margin-top:18px!important; color:#697572!important; font-size:.78rem!important; }
  .hero-urgency,.hero-stats { display:none!important; }
  .hero-photo-frame { max-width:560px!important; }
  .hero-photo-frame img { min-height:430px!important; object-position:center 28%!important; }

  /* Habilitación ligera */
  .enablement-strip { margin-top:-24px!important; padding-bottom:82px!important; }
  .enablement-grid { box-shadow:0 14px 36px rgba(30,110,102,.07)!important; border-color:var(--border)!important; border-radius:16px!important; }
  .enablement-item { padding:22px 28px!important; border-color:var(--border)!important; }
  .enablement-icon { background:#F1FBF9!important; color:#249B92!important; border-color:rgba(69,191,179,.28)!important; }
  .enablement-item strong { color:#2E4743!important; font-size:.86rem!important; }
  .enablement-legal { margin-top:16px!important; color:#74807D!important; }

  /* Quitar bloque redundante para que la página respire */
  .service-paths { display:none!important; }

  /* Secciones: más blanco, aire y jerarquía */
  .services,.experiences,.about,.reviews,.plans,.booking,.faq,.pasaporte-section { padding-top:100px!important; padding-bottom:100px!important; }
  .services { background:#fff!important; }
  .services .container,.experiences .container { display:block!important; }
  .services-header,.experiences-header { position:static!important; max-width:790px!important; margin:0 auto 54px!important; text-align:center!important; }
  .services-header .section-tag,.experiences-header .section-tag,.about-content .section-tag,.reviews-header .section-tag { color:#2CAFA5!important; border:0!important; background:transparent!important; box-shadow:none!important; padding:0!important; letter-spacing:.11em!important; }
  .services-header h2,.experiences-header h2 { font-size:clamp(2.25rem,3.2vw,3.3rem)!important; line-height:1.12!important; margin-top:12px!important; }
  .services-header p,.experiences-header p { max-width:720px!important; margin:18px auto 0!important; color:var(--text-muted)!important; line-height:1.75!important; font-size:.94rem!important; }

  /* Servicios: tarjetas más anchas y menos texto visible */
  .services-grid { grid-template-columns:repeat(3,minmax(0,1fr))!important; gap:28px!important; }
  .service-card { border:1px solid var(--border)!important; border-radius:18px!important; box-shadow:0 12px 32px rgba(32,90,84,.055)!important; overflow:hidden!important; }
  .service-card-img { height:220px!important; }
  .service-card-body { padding:26px!important; }
  .service-card h3 { font-size:1.35rem!important; line-height:1.25!important; margin-bottom:14px!important; }
  .service-card-body > p:not(.service-ideal) { color:var(--text-muted)!important; font-size:.88rem!important; line-height:1.68!important; }
  .service-ideal { display:none!important; }
  .service-price { margin-top:22px!important; padding:11px 13px!important; background:#F0FAF8!important; color:#267E77!important; border-radius:10px!important; font-size:.78rem!important; }
  .carousel-dots { grid-column:auto!important; }

  /* Bienestar: tres columnas amplias, sin listas interminables */
  .experiences { background:#F3FBFA!important; }
  .experience-grid { grid-template-columns:repeat(3,minmax(0,1fr))!important; gap:28px!important; }
  .experience-card { padding:28px!important; border:1px solid var(--border)!important; border-radius:18px!important; background:#fff!important; box-shadow:0 12px 32px rgba(32,90,84,.05)!important; }
  .experience-card::before { height:190px!important; margin:-28px -28px 24px!important; }
  .experience-card h3 { font-size:1.45rem!important; line-height:1.25!important; }
  .experience-card > p:not(.ideal) { color:var(--text-muted)!important; line-height:1.65!important; }
  .experience-card ul,.experience-card .ideal { display:none!important; }
  .experience-price { color:#267E77!important; background:#F0FAF8!important; display:inline-block!important; padding:8px 13px!important; border-radius:999px!important; }
  .soon-pill { color:#248E86!important; border-color:rgba(69,191,179,.35)!important; background:#F4FCFA!important; }

  /* Jessica: texto breve y bloques simples */
  .about { background:#fff!important; }
  .about-grid { grid-template-columns:minmax(340px,.88fr) minmax(0,1.12fr)!important; gap:82px!important; align-items:center!important; }
  .about-photo-wrap { max-width:440px!important; }
  .about-photo-wrap img { border-radius:20px!important; box-shadow:0 14px 38px rgba(32,90,84,.07)!important; }
  .about-content h2 { font-size:clamp(2.5rem,4vw,3.7rem)!important; margin:12px 0 18px!important; }
  .about-body p { font-size:.98rem!important; line-height:1.8!important; color:var(--text-muted)!important; }
  .about-facts-v2 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:28px 0 6px; }
  .about-facts-v2 > div { padding:17px; border:1px solid var(--border); border-radius:14px; background:#F8FCFB; }
  .about-facts-v2 strong { display:block; color:#2E4743; font-size:.82rem; margin-bottom:5px; }
  .about-facts-v2 span { color:#6A7673; font-size:.74rem; line-height:1.45; }
  .about-list,.about-content > p[style*="text-transform:uppercase"] { display:none!important; }

  /* Reseñas Google: siempre visibles y con espacio */
  .reviews { display:block!important; background:#fff!important; }
  .reviews-header { max-width:780px!important; margin:0 auto 44px!important; text-align:center!important; }
  .reviews-header h2 { font-size:clamp(2.2rem,3.3vw,3.25rem)!important; line-height:1.15!important; margin-top:12px!important; }
  .reviews-overall { justify-content:center!important; max-width:780px!important; margin:0 auto 34px!important; }
  .reviews-grid { grid-template-columns:repeat(3,minmax(0,1fr))!important; gap:24px!important; }
  .review-card { padding:24px!important; border:1px solid var(--border)!important; border-radius:16px!important; box-shadow:0 10px 28px rgba(32,90,84,.045)!important; }
  .reviews-google-btn { background:var(--primary)!important; color:#203431!important; border:0!important; }

  /* Footer claro: logo visible */
  .footer { background:#F0FAF8!important; color:#334542!important; border-top:1px solid var(--border)!important; padding:56px 0 34px!important; }
  .footer-inner { gap:34px!important; }
  .footer-logo img { width:220px!important; height:auto!important; opacity:1!important; filter:none!important; display:block!important; }
  .footer-copy,.footer-info p,.footer-links a { color:#5E6E6B!important; }
  .footer-info a,.footer-links a:hover { color:#249B92!important; }
  .footer-sep { background:rgba(69,191,179,.28)!important; }
  .footer::after { color:#657572!important; border-top:1px solid rgba(69,191,179,.22)!important; }

  /* WhatsApp flotante dentro de la identidad turquesa */
  .wa-float-btn { background:var(--primary)!important; color:#173431!important; box-shadow:0 12px 30px rgba(69,191,179,.25)!important; }
  .wa-float-btn:hover { background:var(--primary-hover)!important; color:#173431!important; }

  @media (max-width:1050px) {
    .nav-links { gap:14px!important; }
    .nav-links a { font-size:.66rem!important; }
    .brand-logo { width:195px!important; }
    .services-grid,.experience-grid { grid-template-columns:repeat(2,minmax(0,1fr))!important; }
  }
  @media (max-width:900px) {
    .hero { padding:120px 0 72px!important; background:#fff!important; }
    .hero-grid { grid-template-columns:1fr!important; gap:38px!important; }
    .hero-photo-frame { margin:0 auto!important; }
    .enablement-grid { grid-template-columns:1fr!important; }
    .enablement-item { border-right:0!important; border-bottom:1px solid var(--border)!important; }
    .about-grid { grid-template-columns:1fr!important; gap:46px!important; }
    .about-photo-wrap { margin:0 auto!important; }
    .about-facts-v2 { grid-template-columns:1fr!important; }
  }
  @media (max-width:680px) {
    .services,.experiences,.about,.reviews,.plans,.booking,.faq,.pasaporte-section { padding-top:72px!important; padding-bottom:72px!important; }
    .services-grid,.experience-grid,.reviews-grid { grid-template-columns:1fr!important; gap:20px!important; }
    .service-card-img { height:235px!important; }
    .hero h1 { font-size:2.45rem!important; }
    .footer-inner { display:grid!important; grid-template-columns:1fr!important; text-align:center!important; }
    .footer-logo img { margin:0 auto!important; }
  }
</style>
'''
          if 'id="visual-refresh-v2-2026-08-07"' in t:
              t = re.sub(r'\n<style id="visual-refresh-v2-2026-08-07">.*?</style>\n', '\n'+css+'\n', t, count=1, flags=re.S)
          else:
              t = t.replace('\n</head>', '\n'+css+'\n</head>', 1)

          p.write_text(t, encoding='utf-8')

          # Validaciones mínimas de seguridad y alcance.
          checks = [
              'Masajes y bienestar',
              'href="#reseñas">Reseñas',
              'Recupera tu movimiento con atención fisioterapéutica personalizada.',
              'visual-refresh-v2-2026-08-07',
              'GOOGLE_REVIEWS_URL',
              'loadReviews();',
              'pasaporte.html',
              'APPS_SCRIPT_URL'
          ]
          for s in checks:
              if s not in t:
                  raise SystemExit('Falta validación: '+s)
          print('V2 aplicada y validada')
          PY

      - name: Limpiar workflow temporal y guardar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-visual-v2-2026-08-07.yml
          rm -f .github/visual-v2-trigger-2026-08-07.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: aplicar corrección visual V2"
          git push origin main
