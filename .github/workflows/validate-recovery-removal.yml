name: Validar retiro Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - public-schedule-client.js
      - .github/workflows/validate-recovery-removal.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis y contratos
        run: |
          node --check public-schedule-client.js
          grep -Fq "if (key === 'recovery') return false" public-schedule-client.js
          grep -Fq "if (venueKey(m) === 'recovery') return false" public-schedule-client.js
          grep -Fq "card.dataset.priceRecovery = ''" public-schedule-client.js
          grep -Fq "filter(function (v) { return v && v !== 'recovery'; })" public-schedule-client.js
          grep -Fq "data.ok !== true" public-schedule-client.js
          grep -Fq "if (!data.id)" public-schedule-client.js
          if grep -Fq "mode: 'no-cors'" public-schedule-client.js; then
            echo 'No debe volver el envío no-cors.' >&2
            exit 1
          fi
          echo '✅ Recovery bloqueada y confirmación real de reserva conservada.'
