name: Solicitar reconstrucción pública desde main

on:
  push:
    branches:
      - pages-public-extended-2026-08-06
    paths:
      - .github/workflows/request-legacy-pages-build-public-2026-08-06.yml

permissions:
  pages: write
  contents: read

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Solicitar compilación del origen configurado en main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          printf '%s\n' "${response}"

          for attempt in $(seq 1 360); do
            latest=$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            status=$(printf '%s' "${latest}" | jq -r '.status // "unknown"')
            error_message=$(printf '%s' "${latest}" | jq -r '.error.message // ""')
            commit=$(printf '%s' "${latest}" | jq -r '.commit // ""')
            echo "Intento ${attempt}: ${status} · commit ${commit}"

            case "${status}" in
              built)
                echo "Reconstrucción pública terminada."
                exit 0
                ;;
              errored)
                echo "Error de reconstrucción: ${error_message}" >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "La reconstrucción continúa después de 30 minutos." >&2
          exit 1
