name: Iniciar publicación pública directa desde main

on:
  push:
    branches:
      - pages-public-extended-2026-08-06
    paths:
      - .github/workflows/dispatch-direct-public-main-2026-08-06.yml

permissions:
  actions: write
  contents: read

jobs:
  iniciar:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar workflow directo sobre main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            --output /tmp/dispatch-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-pages-public.yml/dispatches" \
            --data '{"ref":"main"}')
          cat /tmp/dispatch-response.txt || true
          echo "Dispatch: HTTP ${code}"
          test "${code}" = "204"
