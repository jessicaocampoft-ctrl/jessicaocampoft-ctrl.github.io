name: Aplicar ajustes de marca y equipo

on:
  push:
    branches:
      - marca-equipo-header-2026-08-07

permissions:
  contents: write

jobs:
  aplicar:
    if: contains(github.event.head_commit.message, '[brand-team]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajustes aprobados
        run: python .github/apply_brand_team_header.py

      - name: Validar integraciones críticas
        run: |
          grep -q 'by Jessica Ocampo' index.html
          grep -q 'Cuidamos tu movimiento con experiencia clínica y humana' index.html
          grep -q 'loadReviews();' index.html
          grep -q 'APPS_SCRIPT_URL' index.html
          grep -q 'pasaporte.html' index.html

      - name: Limpiar temporales y guardar
        run: |
          rm -f .github/apply_brand_team_header.py
          rm -f .github/workflows/apply-brand-team-header.yml
          rm -f .github/brand-team-trigger-2026-08-07.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: alinear marca y sección de equipo"
          git push origin marca-equipo-header-2026-08-07
