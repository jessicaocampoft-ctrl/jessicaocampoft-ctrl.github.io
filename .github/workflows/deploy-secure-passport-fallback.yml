name: Deploy secure passport backend fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-secure-passport-fallback.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Try available Google credentials and deploy
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          CLASPRC: ${{ secrets.CLASPRC }}
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
          CLASP_AUTH: ${{ secrets.CLASP_AUTH }}
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
          CLASP_CREDS: ${{ secrets.CLASP_CREDS }}
          GOOGLE_CLASP_CREDENTIALS: ${{ secrets.GOOGLE_CLASP_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          APPS_SCRIPT_CREDENTIALS: ${{ secrets.APPS_SCRIPT_CREDENTIALS }}
          GAS_CREDENTIALS: ${{ secrets.GAS_CREDENTIALS }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          CLASP_ACCESS_TOKEN: ${{ secrets.CLASP_ACCESS_TOKEN }}
        run: |
          set +e
          STATUS_FILE="apps-script-deploy-status.txt"
          PUBLIC_DEPLOYMENT="AKfycbwPE46Z_7mnCPTE7KcthlluGXsuqwAofVBHS0jGXv7C8ekLpmPzHu5x0jFYB7yxEquw"
          ADMIN_DEPLOYMENT="AKfycbzLWv3DYB5WxsiT7jMCv5lnfc6oX8IvQJPMU6dGyW3_ZGU7Jj-WfXIWeEuPcI41mQ5L"
          PUBLIC_URL="https://script.google.com/macros/s/${PUBLIC_DEPLOYMENT}/exec"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          npm install -g @google/clasp@2.4.2 >/tmp/npm-clasp.log 2>&1
          AUTH_NAME=""
          AUTH_OK=0
          CANDIDATES="CLASPRC_JSON CLASP_CREDENTIALS CLASPRC CLASP_TOKEN CLASP_AUTH CLASP_CREDENTIALS_JSON CLASP_CREDS GOOGLE_CLASP_CREDENTIALS GOOGLE_CREDENTIALS APPS_SCRIPT_CREDENTIALS GAS_CREDENTIALS GOOGLE_OAUTH_CREDENTIALS GOOGLE_TOKEN CLASP_ACCESS_TOKEN"

          for name in $CANDIDATES; do
            value="${!name}"
            [ -z "$value" ] && continue
            printf '%s' "$value" > "$HOME/.clasprc.json"
            if ! jq -e . "$HOME/.clasprc.json" >/dev/null 2>&1; then
              printf '%s' "$value" | base64 -d > "$HOME/.clasprc.json" 2>/dev/null
            fi
            jq -e . "$HOME/.clasprc.json" >/dev/null 2>&1 || continue
            clasp deployments >/tmp/clasp-auth-test.log 2>&1
            if [ $? -eq 0 ]; then
              AUTH_NAME="$name"
              AUTH_OK=1
              break
            fi
          done

          if [ $AUTH_OK -ne 1 ]; then
            printf 'STATUS=NO_USABLE_CLASP_CREDENTIALS\nTIME=%s\n' "$NOW" > "$STATUS_FILE"
          else
            clasp push -f >/tmp/clasp-push.log 2>&1
            if [ $? -ne 0 ]; then
              printf 'STATUS=FAILED_PUSH\nTIME=%s\nAUTH_SOURCE=%s\nDETAIL=%s\n' "$NOW" "$AUTH_NAME" "$(tail -n 3 /tmp/clasp-push.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')" > "$STATUS_FILE"
            else
              DEPLOYMENTS="$(clasp deployments 2>&1)"
              UPDATED=""
              if printf '%s' "$DEPLOYMENTS" | grep -Fq "$PUBLIC_DEPLOYMENT"; then
                clasp deploy -i "$PUBLIC_DEPLOYMENT" -d "Secure passport ${NOW}" >/tmp/deploy-public.log 2>&1
                [ $? -eq 0 ] && UPDATED="${UPDATED}public," || UPDATED="${UPDATED}public_failed,"
              else
                UPDATED="${UPDATED}public_not_found,"
              fi
              if printf '%s' "$DEPLOYMENTS" | grep -Fq "$ADMIN_DEPLOYMENT"; then
                clasp deploy -i "$ADMIN_DEPLOYMENT" -d "Secure passport ${NOW}" >/tmp/deploy-admin.log 2>&1
                [ $? -eq 0 ] && UPDATED="${UPDATED}admin," || UPDATED="${UPDATED}admin_failed,"
              else
                UPDATED="${UPDATED}admin_not_found,"
              fi
              sleep 12
              RESPONSE="$(curl -L -sS --max-time 35 "${PUBLIC_URL}?action=getPassportSecure&id=INVALID&token=INVALID" | head -c 600 | tr '\n' ' ')"
              if printf '%s' "$RESPONSE" | grep -Eqi 'pasaporte|enlace|inv[aá]lid|no encontrado|"ok"[[:space:]]*:[[:space:]]*false'; then
                VERIFY="VERIFIED_SECURE_ROUTE"
              else
                VERIFY="UNVERIFIED_SECURE_ROUTE"
              fi
              printf 'STATUS=DEPLOYED\nTIME=%s\nAUTH_SOURCE=%s\nUPDATED=%s\nVERIFY=%s\nRESPONSE=%s\n' "$NOW" "$AUTH_NAME" "$UPDATED" "$VERIFY" "$RESPONSE" > "$STATUS_FILE"
            fi
          fi

          rm -f "$HOME/.clasprc.json"
          rm -f .github/workflows/deploy-secure-passport-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pasaporte): registrar intento final de despliegue"
          git push
