name: Diagnose admin login backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-admin-login-backend.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract admin login backend safely
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('google-apps-script.js')
          text = path.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          patterns = [
              r'adminLogin', r'createAdminSession', r'ADMIN_SESSION', r'sessionToken',
              r'validateAdmin', r'checkAdmin', r'doPost', r'JSON\.parse\(.*postData',
              r'Credenciales incorrectas', r'Demasiados intentos'
          ]
          hits = set()
          for i, line in enumerate(lines):
              if any(re.search(p, line, re.I) for p in patterns):
                  for j in range(max(0, i-18), min(len(lines), i+50)):
                      hits.add(j)
          out = []
          for j in sorted(hits):
              line = lines[j]
              line = re.sub(r'((?:PASSWORD|PASS|PW|SECRET)\s*=\s*)["\'][^"\']*["\']', r'\1"[REDACTED]"', line, flags=re.I)
              out.append(f'{j+1}: {line}')
          Path('admin-login-backend-diagnostics.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')

      - name: Basic syntax check
        shell: bash
        run: |
          cp google-apps-script.js /tmp/google-apps-script-check.js
          node --check /tmp/google-apps-script-check.js > admin-login-backend-syntax.txt 2>&1 || true

      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/diagnose-admin-login-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar diagnóstico del backend"
          git push
