name: Fix passport admin session bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-passport-session-bridge.yml"

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Apps Script session validation
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          path = Path('google-apps-script.js')
          text = path.read_text(encoding='utf-8-sig')

          bridge = textwrap.dedent(r'''
          // El administrador estable y el pasaporte viven en proyectos Apps Script distintos.
          // Las acciones administrativas del pasaporte validan la sesión contra el backend
          // estable que la creó. La contraseña nunca se comparte ni se almacena aquí.
          var LEGACY_ADMIN_BACKEND_URL_ = 'https://script.google.com/macros/s/AKfycbzFlqrTerVorQDn0_u_D29rh3cTRstc1XBxYDAn5-2YyexMSpip0m2RPcjzJMK7VDjd/exec';

          function isPassportAdminAction_(action) {
            return [
              'passportEnsure',
              'passportSaveProgress',
              'passportRegenerateToken',
              'passportDeactivate',
              'passportReactivate',
              'savePassport'
            ].indexOf(action || '') !== -1;
          }

          function validatePassportAdminSession_(token) {
            if (validateSession(token)) return true;
            if (!token || token.length < 20) return false;

            var cache = CacheService.getScriptCache();
            var cacheKey = 'legacy_admin_ok_' + token;
            if (cache.get(cacheKey) === '1') return true;

            try {
              var url = LEGACY_ADMIN_BACKEND_URL_
                + '?action=ping&token=' + encodeURIComponent(token)
                + '&_bridge=' + new Date().getTime();
              var response = UrlFetchApp.fetch(url, {
                method: 'get',
                muteHttpExceptions: true,
                followRedirects: true,
                validateHttpsCertificates: true
              });
              if (response.getResponseCode() !== 200) return false;
              var data = JSON.parse(response.getContentText() || '{}');
              if (data && data.ok === true) {
                cache.put(cacheKey, '1', 60);
                return true;
              }
            } catch (err) {
              console.error('No se pudo validar la sesión del administrador para Pasaporte: ' + err.message);
            }
            return false;
          }
          ''').strip('\n')

          if 'function validatePassportAdminSession_(token)' not in text:
            pattern = re.compile(
              r"(function\s+validateSession\s*\(token\)\s*\{.*?\n\})",
              re.S
            )
            text, count = pattern.subn(lambda m: m.group(1) + '\n\n' + bridge, text, count=1)
            if count != 1:
              raise SystemExit('No se encontró validateSession para insertar el puente')

          guard_pattern = re.compile(
            r"\s{2}if\s*\(!validateSession\(p\.token\)\)\s*\{\s*"
            r"return\s+js\(\{ok:\s*false,\s*error:\s*'Sin permiso'\}\);\s*"
            r"\}\s*"
            r"// Ventana deslizante: renovar TTL en cada acción válida\s*"
            r"CacheService\.getScriptCache\(\)\.put\('sess_'\s*\+\s*p\.token,\s*'1',\s*14400\);",
            re.S
          )

          new_guard = textwrap.dedent(r'''
            var localSessionValid = validateSession(p.token);
            var passportSessionValid = isPassportAdminAction_(p.action)
              && validatePassportAdminSession_(p.token);
            if (!localSessionValid && !passportSessionValid) {
              return js({ok: false, error: 'Sin permiso'});
            }
            // Solo renueva sesiones creadas en este mismo proyecto.
            if (localSessionValid) {
              CacheService.getScriptCache().put('sess_' + p.token, '1', 14400);
            }
          ''').rstrip()

          if 'var passportSessionValid = isPassportAdminAction_(p.action)' not in text:
            text, count = guard_pattern.subn(new_guard, text, count=1)
            if count != 1:
              raise SystemExit('No se encontró el guard de sesión de doGet')

          required = [
            'function validatePassportAdminSession_(token)',
            'var passportSessionValid = isPassportAdminAction_(p.action)',
            'LEGACY_ADMIN_BACKEND_URL_',
            "if (p.action === 'passportEnsure')"
          ]
          missing = [item for item in required if item not in text]
          if missing:
            raise SystemExit('Validación incompleta: ' + ', '.join(missing))

          path.write_text(text, encoding='utf-8')
          print('Puente de sesión instalado correctamente')

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp@3.3.0

      - name: Restore Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push and update both deployments
        run: |
          printf '%s' '{"scriptId":"1KVmo_TpTAkwLXQjMVvSO51YDtojr64XsnWg8I7bz0UkGht9S1W7WD0zI","rootDir":"."}' > .clasp.json
          printf '%s\n' '**/**' '!appsscript.json' '!google-apps-script.js' > .claspignore
          clasp push --force
          clasp deploy --deploymentId AKfycbwPE46Z_7mnCPTE7KcthlluGXsuqwAofVBHS0jGXv7C8ekLpmPzHu5x0jFYB7yxEquw --description "Passport session bridge $GITHUB_SHA"
          clasp deploy --deploymentId AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC --description "Passport session bridge $GITHUB_SHA"

      - name: Verify deployed guards
        shell: bash
        run: |
          set -euo pipefail
          public='https://script.google.com/macros/s/AKfycbwPE46Z_7mnCPTE7KcthlluGXsuqwAofVBHS0jGXv7C8ekLpmPzHu5x0jFYB7yxEquw/exec'
          admin='https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec'
          public_body="$(curl -L -sS --max-time 45 "$public?action=getPassportSecure&id=INVALIDO&token=INVALIDO")"
          printf '%s' "$public_body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*false'
          guard_body="$(curl -L -sS --max-time 45 "$admin?action=passportEnsure&token=INVALIDO&nombre=Prueba")"
          printf '%s' "$guard_body" | grep -Fq 'Sin permiso'

      - name: Commit source and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-passport-session-bridge.yml .claspignore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pasaporte): validar sesión del administrador entre backends"
          git push
